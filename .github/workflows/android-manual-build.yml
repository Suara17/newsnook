name: Android Manual Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: '打包变体 (all: 全部, local: 离线翻译版, cloud: 云翻译轻量版)'
        required: true
        type: choice
        options:
          - all
          - local
          - cloud
        default: all
      format:
        description: '产物类型 (apk, aab, all)'
        required: true
        type: choice
        options:
          - apk
          - aab
          - all
        default: apk

concurrency:
  group: android-manual-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NEWSNOOK_KEYSTORE_PASSWORD: ${{ secrets.NEWSNOOK_KEYSTORE_PASSWORD }}
      NEWSNOOK_KEY_ALIAS: ${{ secrets.NEWSNOOK_KEY_ALIAS }}
      NEWSNOOK_KEY_PASSWORD: ${{ secrets.NEWSNOOK_KEY_PASSWORD }}
      # push 触发时 inputs 为空，设置默认值
      BUILD_FLAVOR: ${{ inputs.flavor || 'all' }}
      BUILD_FORMAT: ${{ inputs.format || 'apk' }}
      VITE_CLOUD_BASE_URL: ${{ vars.VITE_CLOUD_BASE_URL || 'https://api-news.aizeek.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1'

      - name: Restore release keystore
        env:
          NEWSNOOK_KEYSTORE_BASE64: ${{ secrets.NEWSNOOK_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/newsnook-release.jks"
          if [ -z "$NEWSNOOK_KEYSTORE_BASE64" ]; then
            echo "NEWSNOOK_KEYSTORE_BASE64 not configured. Generating build keystore automatically..."
            keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -storetype JKS -storepass newsnook123 -keypass newsnook123 -alias newsnook -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=News Nook, OU=Mobile, O=Aizeek, L=Shanghai, ST=Shanghai, C=CN"
            echo "NEWSNOOK_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "NEWSNOOK_KEYSTORE_PASSWORD=newsnook123" >> "$GITHUB_ENV"
            echo "NEWSNOOK_KEY_ALIAS=newsnook" >> "$GITHUB_ENV"
            echo "NEWSNOOK_KEY_PASSWORD=newsnook123" >> "$GITHUB_ENV"
          else
            for name in NEWSNOOK_KEYSTORE_PASSWORD NEWSNOOK_KEY_ALIAS NEWSNOOK_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Secret ${name} is missing."
                exit 1
              fi
            done
            printf '%s' "$NEWSNOOK_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "NEWSNOOK_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "Restored keystore to ${KEYSTORE_PATH}"
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Bergamot native engine
        if: ${{ env.BUILD_FLAVOR == 'all' || env.BUILD_FLAVOR == 'local' }}
        run: npm run bergamot:init

      - name: Build signed APK
        if: ${{ env.BUILD_FORMAT == 'apk' || env.BUILD_FORMAT == 'all' }}
        run: |
          if [ "$BUILD_FLAVOR" = "all" ]; then
            npm run android:apk
          else
            npm run "android:apk:$BUILD_FLAVOR"
          fi

      - name: Build signed AAB
        if: ${{ env.BUILD_FORMAT == 'aab' || env.BUILD_FORMAT == 'all' }}
        run: |
          if [ "$BUILD_FLAVOR" = "all" ]; then
            npm run android:aab
          else
            npm run "android:aab:$BUILD_FLAVOR"
          fi

      - name: List artifacts
        run: ls -lh artifacts/android/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newsnook-${{ github.ref_name }}-${{ env.BUILD_FLAVOR }}-${{ env.BUILD_FORMAT }}-${{ github.run_id }}
          path: artifacts/android/*
          retention-days: 14

